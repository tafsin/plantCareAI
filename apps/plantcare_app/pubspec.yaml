name: plantcare_app
description: Cross-platform PlantCare AI application composition and bootstrap.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.1

resolution: workspace

dependencies:
  cloud_firestore: ^6.9.0
  equatable: ^2.1.0
  firebase_app_check: ^0.4.7
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^18.0.1
  injectable: ^3.0.0
  plantcare_data:
    path: ../../packages/plantcare_data
  plantcare_domain:
    path: ../../packages/plantcare_domain
  plantcare_features:
    path: ../../packages/plantcare_features
  plantcare_shared:
    path: ../../packages/plantcare_shared
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.9.2
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
