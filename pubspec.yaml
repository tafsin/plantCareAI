name: plantcare_workspace
description: Workspace orchestration for PlantCare AI.
publish_to: none

environment:
  sdk: ^3.13.1

workspace:
  - apps/plantcare_app
  - packages/plantcare_data
  - packages/plantcare_domain
  - packages/plantcare_features
  - packages/plantcare_shared

dev_dependencies:
  melos: 7.4.0

melos:
  useRootAsPackage: false
  scripts:
    bootstrap:
      description: Resolve all workspace dependencies.
      run: dart pub get
    boundaries:
      description: Enforce package dependency and import boundaries.
      run: dart run tool/check_package_boundaries.dart
    generate:data:
      description: Generate the data micro-package module.
      run: >-
        dart run build_runner build &&
        dart format lib/src/dependency_injection/injection.module.dart
      exec: {}
      packageFilters:
        scope: plantcare_data
    generate:features:
      description: Generate the features micro-package module.
      run: >-
        dart run build_runner build &&
        dart format lib/src/dependency_injection/injection.module.dart
      exec: {}
      packageFilters:
        scope: plantcare_features
    generate:app:
      description: Generate the final application composition graph.
      run: >-
        dart run build_runner build &&
        dart format lib/app/dependency_injection/injection.config.dart
      exec: {}
      packageFilters:
        scope: plantcare_app
    generate:
      description: Generate data, features, then application DI code.
      steps:
        - melos run generate:data
        - melos run generate:features
        - melos run generate:app
    format:
      description: Check formatting for repository-owned Dart sources.
      run: >-
        dart format --output=none --set-exit-if-changed
        apps/plantcare_app/lib apps/plantcare_app/test
        packages/plantcare_shared/lib packages/plantcare_shared/test
        packages/plantcare_domain/lib packages/plantcare_domain/test
        packages/plantcare_data/lib packages/plantcare_data/test
        packages/plantcare_features/lib packages/plantcare_features/test tool
    analyze:
      description: Analyze every workspace package.
      run: dart analyze .
    test:shared:
      description: Run plantcare_shared tests.
      run: dart test
      exec: {}
      packageFilters:
        scope: plantcare_shared
    test:domain:
      description: Run plantcare_domain tests.
      run: dart test
      exec: {}
      packageFilters:
        scope: plantcare_domain
    test:dart:
      description: Run both pure-Dart package test suites.
      steps:
        - melos run test:shared
        - melos run test:domain
    test:data:
      description: Run plantcare_data tests.
      run: flutter test
      exec: {}
      packageFilters:
        scope: plantcare_data
    test:features:
      description: Run plantcare_features tests.
      run: flutter test
      exec: {}
      packageFilters:
        scope: plantcare_features
    test:app:
      description: Run plantcare_app tests.
      run: flutter test
      exec: {}
      packageFilters:
        scope: plantcare_app
    test:flutter:
      description: Run all Flutter package tests.
      steps:
        - melos run test:data
        - melos run test:features
        - melos run test:app
    test:
      description: Run all Dart and Flutter tests.
      steps:
        - melos run test:dart
        - melos run test:flutter
    build:web:
      description: Build the application for Firebase Hosting.
      run: flutter build web --release
      exec: {}
      packageFilters:
        scope: plantcare_app
