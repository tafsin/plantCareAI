name: plantcare_features
description: Flutter presentation features for PlantCare AI.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.1

resolution: workspace

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  injectable: ^3.0.0
  plantcare_domain:
    path: ../plantcare_domain
  plantcare_shared:
    path: ../plantcare_shared
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  get_it: ^9.2.1
  image: ^4.9.2
  injectable_generator: ^3.1.3

flutter:
  assets:
    - assets/auth/google_g.png
    - assets/auth/OFL.txt
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/auth/google_sans.ttf
          weight: 500
