name: plantcare_data
description: Firebase and platform data implementations for PlantCare AI.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.1

resolution: workspace

dependencies:
  cloud_firestore: ^6.9.0
  firebase_ai: ^4.0.0
  firebase_auth: ^6.6.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  google_sign_in: ^7.2.0
  image: ^4.9.2
  image_picker: ^1.2.3
  injectable: ^3.0.0
  plantcare_domain:
    path: ../plantcare_domain
  plantcare_shared:
    path: ../plantcare_shared
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
